<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বাকির খাতা</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14302B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#EEF2F0;--card:#fff;--ink:#14302B;--mute:#5E7570;--line:#D5DFDB;--owe:#B42318;--got:#1B7A4B;--brand:#14302B;--on-brand:#fff;--sheet:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101A18;--card:#18262A;--ink:#E6F0EC;--mute:#8FA7A1;--line:#2A3C3A;--owe:#FF8A7A;--got:#5FD39A;--brand:#5FD39A;--on-brand:#0B1412;--sheet:#18262A}}
:root[data-theme="dark"]{--bg:#101A18;--card:#18262A;--ink:#E6F0EC;--mute:#8FA7A1;--line:#2A3C3A;--owe:#FF8A7A;--got:#5FD39A;--brand:#5FD39A;--on-brand:#0B1412;--sheet:#18262A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind Siliguri',system-ui,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 14px;font-weight:700}
.total{background:var(--brand);color:var(--on-brand);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.total small{opacity:.85;font-size:15px}
.total b{display:block;font-size:34px;line-height:1.2;font-weight:700}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px}
input:focus,button:focus-visible{outline:3px solid var(--got);outline-offset:1px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:14px 16px;cursor:pointer}
.row:first-child{border-radius:12px 12px 0 0}.row:last-child{border-radius:0 0 12px 12px;border-bottom:0}.row:only-child{border-radius:12px}
.nm{font-weight:600}.ph{color:var(--mute);font-size:14px}
.amt{font-weight:700;font-size:18px;white-space:nowrap}.owe{color:var(--owe)}.got{color:var(--got)}
.empty{background:var(--card);border-radius:12px;padding:22px;text-align:center;color:var(--mute)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--on-brand);border:0;border-radius:30px;padding:14px 26px;font:inherit;font-weight:600;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.back.on{display:flex}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 2px;font-size:20px}
.btns{display:flex;gap:8px;margin:0 0 10px}
.btn{flex:1;font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 8px;cursor:pointer;color:#fff}
.b-owe{background:#B42318}.b-got{background:#1B7A4B}.b-sec{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.tx{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:15px}
.tx span:first-child{color:var(--mute)}
.del{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:10px 0}
#login{display:none;max-width:420px;margin:0 auto;padding:40px 16px}
#login p{color:var(--mute);margin:0 0 16px}
.err{color:var(--owe);font-size:15px;min-height:22px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center}
.out{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div id="login">
  <h1>বাকির খাতা</h1>
  <p>লগইন করলে আপনার হিসাব ক্লাউডে জমা থাকবে। যেকোনো ফোন থেকে দেখা যাবে।</p>
  <input id="em" type="email" placeholder="ইমেইল" autocomplete="email">
  <input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="current-password">
  <div class="err" id="er"></div>
  <div class="btns"><button class="btn b-got" onclick="auth('in')">লগইন</button><button class="btn b-sec" onclick="auth('up')">নতুন অ্যাকাউন্ট</button></div>
</div>
<div class="wrap" id="app">
  <div class="top"><h1>বাকির খাতা</h1><button class="out" id="outb" onclick="logout()" style="display:none">লগআউট</button></div>
  <div class="total"><small>মোট পাওনা</small><b id="tot">৳০</b></div>
  <input id="q" placeholder="গ্রাহক খুঁজুন" oninput="render()" autocomplete="off">
  <div id="list"></div>
</div>
<button class="fab" onclick="openNew()">+ নতুন গ্রাহক</button>

<div class="back" id="m1" onclick="if(event.target===this)closeAll()">
  <div class="sheet">
    <h2>নতুন গ্রাহক</h2>
    <p class="ph" style="margin:0 0 12px">নাম ও ফোন নম্বর লিখুন</p>
    <input id="n" placeholder="গ্রাহকের নাম" autocomplete="off">
    <input id="p" placeholder="ফোন নম্বর (যেমন ০১৭১২৩৪৫৬৭৮)" inputmode="tel" autocomplete="off">
    <div class="btns"><button class="btn b-sec" onclick="closeAll()">বাতিল</button><button class="btn b-got" onclick="addC()">সংরক্ষণ করুন</button></div>
  </div>
</div>

<div class="back" id="m2" onclick="if(event.target===this)closeAll()">
  <div class="sheet">
    <h2 id="dn"></h2>
    <div class="ph" id="dp" style="margin-bottom:8px"></div>
    <div class="amt" id="db" style="font-size:26px;margin-bottom:12px"></div>
    <input id="a" placeholder="টাকার পরিমাণ" inputmode="numeric" autocomplete="off">
    <input id="nt" placeholder="নোট (ঐচ্ছিক)" autocomplete="off">
    <div class="btns"><button class="btn b-owe" onclick="addT('baki')">বাকি দিলাম</button><button class="btn b-got" onclick="addT('joma')">টাকা পেলাম</button></div>
    <div class="btns"><button class="btn b-sec" onclick="remind('wa')">WhatsApp-এ মনে করান</button><button class="btn b-sec" onclick="remind('sms')">SMS পাঠান</button></div>
    <div id="hist"></div>
    <button class="del" onclick="delC()">এই গ্রাহক মুছুন</button>
    <button class="btn b-sec" style="width:100%" onclick="closeAll()">বন্ধ করুন</button>
  </div>
</div>

<script>
var KEY='baki-khata-v1',data=[],cur=null;
var FIREBASE_CONFIG={apiKey:"AIzaSyC9OXyi_KmI_QUm6ksYOfwFmpNKrUYmBTk",authDomain:"baki-khata-cef2b.firebaseapp.com",projectId:"baki-khata-cef2b",appId:"1:1095876966684:web:aeae0482f50aefe65a62d9"};
var CLOUD=FIREBASE_CONFIG.apiKey!=="YOUR_API_KEY",db=null,uid=null,unsub=null;
function loadLocal(){try{data=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){data=[]}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}
  if(CLOUD&&uid){db.doc('books/'+uid).set({data:JSON.stringify(data),t:Date.now()}).catch(function(){})}
}
function show(loggedIn){
  document.getElementById('login').style.display=loggedIn?'none':'block';
  document.getElementById('app').style.display=loggedIn?'block':'none';
  document.querySelector('.fab').style.display=loggedIn?'block':'none';
  document.getElementById('outb').style.display=CLOUD?'block':'none';
}
function msg(e){var c=e&&e.code||'';
  if(c.indexOf('invalid-email')>-1)return 'ইমেইলটি সঠিক নয়।';
  if(c.indexOf('weak-password')>-1)return 'পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।';
  if(c.indexOf('email-already')>-1)return 'এই ইমেইলে অ্যাকাউন্ট আছে। লগইন করুন।';
  if(c.indexOf('invalid-credential')>-1||c.indexOf('wrong-password')>-1||c.indexOf('user-not-found')>-1)return 'ইমেইল বা পাসওয়ার্ড ভুল।';
  if(c.indexOf('network')>-1)return 'ইন্টারনেট সংযোগ নেই।';
  return 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।'}
function auth(m){
  var e=document.getElementById('em').value.trim(),p=document.getElementById('pw').value;
  document.getElementById('er').textContent='';
  var r=m==='up'?firebase.auth().createUserWithEmailAndPassword(e,p):firebase.auth().signInWithEmailAndPassword(e,p);
  r.catch(function(x){document.getElementById('er').textContent=msg(x)});
}
function logout(){if(confirm('লগআউট করবেন?'))firebase.auth().signOut()}
function init(){
  loadLocal();
  if(!CLOUD){show(true);render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
  firebase.auth().onAuthStateChanged(function(u){
    if(unsub){unsub();unsub=null}
    if(!u){uid=null;data=[];closeAll();show(false);render();return}
    uid=u.uid;show(true);
    unsub=db.doc('books/'+uid).onSnapshot(function(d){
      if(d.exists){try{data=JSON.parse(d.data().data)||[]}catch(e){data=[]}}
      else{loadLocal();if(data.length)save()}
      if(cur){var id=cur.id;cur=data.filter(function(c){return c.id===id})[0]||null;if(cur)drawC();else closeAll()}
      render();
    });
  });
}
function bn(n){return Number(n).toLocaleString('bn-BD')}
function tk(n){return '৳'+bn(Math.abs(n))}
function bal(c){return c.tx.reduce(function(s,t){return s+(t.k==='baki'?t.a:-t.a)},0)}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase(),t=0,h='';
  data.forEach(function(c){var b=bal(c);if(b>0)t+=b});
  document.getElementById('tot').textContent=tk(t);
  var L=data.filter(function(c){return !q||c.n.toLowerCase().indexOf(q)>-1||(c.p||'').indexOf(q)>-1});
  L.sort(function(a,b){return bal(b)-bal(a)});
  if(!L.length){h='<div class="empty">'+(data.length?'কোনো গ্রাহক পাওয়া যায়নি।':'এখনো কোনো গ্রাহক নেই। নিচের বাটনে চাপ দিয়ে প্রথম গ্রাহক যোগ করুন।')+'</div>'}
  L.forEach(function(c){var b=bal(c);
    h+='<button class="row" onclick="openC(\''+c.id+'\')"><span><span class="nm">'+esc(c.n)+'</span><br><span class="ph">'+esc(c.p||'ফোন নেই')+'</span></span><span class="amt '+(b>0?'owe':'got')+'">'+(b>0?tk(b)+' পাবো':b<0?tk(b)+' অগ্রিম':'পরিশোধিত')+'</span></button>'});
  document.getElementById('list').innerHTML=h;
}
function closeAll(){document.getElementById('m1').classList.remove('on');document.getElementById('m2').classList.remove('on');cur=null}
function openNew(){document.getElementById('n').value='';document.getElementById('p').value='';document.getElementById('m1').classList.add('on');setTimeout(function(){document.getElementById('n').focus()},50)}
function addC(){
  var n=document.getElementById('n').value.trim(),p=document.getElementById('p').value.trim();
  if(!n){document.getElementById('n').focus();return}
  data.push({id:'c'+Date.now(),n:n,p:p,tx:[]});save();closeAll();render();
}
function openC(id){
  cur=data.filter(function(c){return c.id===id})[0];if(!cur)return;
  document.getElementById('a').value='';document.getElementById('nt').value='';
  drawC();document.getElementById('m2').classList.add('on');
}
function drawC(){
  var b=bal(cur),h='';
  document.getElementById('dn').textContent=cur.n;
  document.getElementById('dp').textContent=cur.p||'ফোন নম্বর নেই';
  var d=document.getElementById('db');
  d.textContent=b>0?tk(b)+' পাবো':b<0?tk(b)+' অগ্রিম':'কোনো বাকি নেই';
  d.className='amt '+(b>0?'owe':'got');
  cur.tx.slice().reverse().forEach(function(t){
    h+='<div class="tx"><span>'+esc(t.d)+(t.nt?' · '+esc(t.nt):'')+'</span><span class="'+(t.k==='baki'?'owe':'got')+'">'+(t.k==='baki'?'বাকি ':'জমা ')+tk(t.a)+'</span></div>'});
  document.getElementById('hist').innerHTML=h||'<div class="ph" style="padding:8px 0">এখনো কোনো লেনদেন নেই।</div>';
}
function addT(k){
  var a=parseFloat(String(document.getElementById('a').value).replace(/[^\d.]/g,''));
  if(!a||a<=0){document.getElementById('a').focus();return}
  var d=new Date();
  cur.tx.push({k:k,a:a,nt:document.getElementById('nt').value.trim(),d:d.toLocaleDateString('bn-BD',{day:'numeric',month:'short'})});
  save();document.getElementById('a').value='';document.getElementById('nt').value='';drawC();render();
}
function remind(how){
  var b=bal(cur);
  if(b<=0){alert('এই গ্রাহকের কোনো বাকি নেই।');return}
  if(!cur.p){alert('আগে গ্রাহকের ফোন নম্বর দিন।');return}
  var msg='আসসালামু আলাইকুম '+cur.n+', আপনার কাছে আমার '+tk(b)+' বাকি আছে। সুবিধামতো পরিশোধ করার অনুরোধ রইল। ধন্যবাদ।';
  var ph=cur.p.replace(/[^\d]/g,'');
  if(how==='wa'){if(ph.charAt(0)==='0')ph='88'+ph;window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank')}
  else{window.location.href='sms:'+ph+'?body='+encodeURIComponent(msg)}
}
function delC(){
  if(!confirm(cur.n+' এবং তাঁর সব হিসাব মুছে যাবে। নিশ্চিত?'))return;
  data=data.filter(function(c){return c.id!==cur.id});save();closeAll();render();
}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
init();
</script>
</body>
</html>
